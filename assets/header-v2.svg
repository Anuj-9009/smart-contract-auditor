<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text-title {
      font-family: 'Sora', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#headerGrad);
      filter: drop-shadow(0px 8px 16px rgba(239, 68, 68, 0.3));
      letter-spacing: 0.08em;
    }
    .text-subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
      opacity: 0.65;
      letter-spacing: 0.16em;
    }
    .glow-blob {
      animation: floatBlob 7s ease-in-out infinite alternate;
    }
    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1); filter: blur(35px); opacity: 0.35; }
      100% { transform: translate(30px, -15px) scale(1.18); filter: blur(45px); opacity: 0.6; }
    }
  </style>
  <rect width="800" height="160" fill="#0d0707" rx="16" />
  
  <!-- Background Blur Decorative Blobs -->
  <circle class="glow-blob" cx="190" cy="80" r="75" fill="#f59e0b" />
  <circle class="glow-blob" cx="610" cy="90" r="65" fill="#ef4444" style="animation-delay: -3.5s;" />
  
  <!-- Custom Cyber Secure Scanner Grid for Smart Contracts -->
    <line x1="0" y1="25" x2="800" y2="25" stroke="rgba(239,68,68,0.08)" stroke-width="1" />
    <line x1="0" y1="135" x2="800" y2="135" stroke="rgba(239,68,68,0.08)" stroke-width="1" />
    <path d="M 120 10 L 120 150 M 680 10 L 680 150" stroke="rgba(239,68,68,0.1)" stroke-width="1.5" stroke-dasharray="6 6" />
    <rect x="360" y="30" width="80" height="100" rx="10" stroke="rgba(245,158,11,0.15)" stroke-width="2" fill="none" />
    <circle cx="400" cy="80" r="25" fill="#ef4444" opacity="0.05" />
  
  <!-- Title Text -->
  <text x="50%" y="78" dominant-baseline="middle" text-anchor="middle" class="text-title">S M A R T  C O N T R A C T  A U D I T O R</text>
  <text x="50%" y="122" dominant-baseline="middle" text-anchor="middle" class="text-subtitle">AUTOMATED VULNERABILITY DETECTOR & MONITOR</text>
  
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
</svg>