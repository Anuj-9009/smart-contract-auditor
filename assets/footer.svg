<svg width="600" height="110" viewBox="0 0 600 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .player-card {
      fill: #09090b;
      stroke: rgba(239, 68, 68, 0.25);
      stroke-width: 1.5;
      rx: 16px;
    }
    .scanner-line {
      stroke: #ef4444;
      stroke-width: 1.5;
      animation: scanGrid 3s infinite ease-in-out alternate;
    }
    .alert-node {
      fill: #ef4444;
      animation: nodePulse 1.5s infinite alternate ease-in-out;
    }
    .signature-text {
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ef4444;
    }
    .track-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #f59e0b;
    }
    .marquee {
      animation: slideMarquee 15s linear infinite;
    }
    .heart {
      fill: #ef4444;
      animation: heartbeat 1.2s infinite alternate ease-in-out;
      transform-origin: 228px 78px;
    }
    @keyframes scanGrid {
      0% { y1: 20; y2: 20; }
      100% { y1: 90; y2: 90; filter: drop-shadow(0 0 4px #ef4444); }
    }
    @keyframes nodePulse {
      0% { fill: #dc2626; opacity: 0.4; }
      100% { fill: #f59e0b; opacity: 1; filter: drop-shadow(0 0 5px #f59e0b); }
    }
    @keyframes slideMarquee {
      0% { transform: translate(0px, 0); }
      100% { transform: translate(-330px, 0); }
    }
    @keyframes heartbeat {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.1); filter: drop-shadow(0 0 3px #ef4444); }
    }
  </style>
  <rect x="1" y="1" width="598" height="108" class="player-card" />
  <circle cx="50" cy="55" r="40" fill="#ef4444" opacity="0.08" filter="blur(20px)" />
  <line x1="20" y1="20" x2="80" y2="20" class="scanner-line" />
  <rect x="20" y="20" width="60" height="70" stroke="rgba(239, 68, 68, 0.1)" stroke-width="1" />
  <circle class="alert-node" cx="50" cy="55" r="5" />
  <svg x="120" y="24" width="360" height="24" viewBox="0 0 360 24" style="overflow: hidden;">
    <g class="marquee">
      <text x="0" y="16" class="track-text">Now Playing: "HUMBLE." — Kendrick Lamar   •   Now Playing: "HUMBLE." — Kendrick Lamar</text>
    </g>
  </svg>
  <text x="120" y="78" class="signature-text">built by ANUJ with</text>
  <path class="heart" d="M248,74 C247,72 244,72 243,73 C242,74 242,76 244,78 L248,82 L252,78 C254,76 254,74 253,73 C252,72 249,72 248,74 Z" />
  <text x="261" y="78" class="signature-text">to the raw frequencies of kendrick lamar's "HUMBLE."</text>
</svg>